[project]
name = "ajan_ekibi"
version = "0.1.0"
description = "CrewAI ile Claude tabanlı yapay zekâ ajan ekibi"
authors = [{ name = "asezerkoc" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools,anthropic]>=1.15.30,<2.0.0"
]

[project.scripts]
ajan_ekibi = "ajan_ekibi.main:run"
run_crew = "ajan_ekibi.main:run"
gunluk = "ajan_ekibi.main:gunluk"
train = "ajan_ekibi.main:train"
replay = "ajan_ekibi.main:replay"
test = "ajan_ekibi.main:test"
run_with_trigger = "ajan_ekibi.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "15a21cd5-b13c-479c-919e-99e7b6a54b60"
