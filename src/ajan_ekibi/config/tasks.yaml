# Example tasks (placeholders). Replace them with the SKONSTART team's tasks once the roles are defined.
research_task:
  description: >
    Şu iş için kapsamlı bir araştırma yap: {gorev}
    İçinde bulunduğumuz yıl {current_year}; bilgilerin güncel olduğundan emin ol.
  expected_output: >
    İşle ilgili en önemli 10 bilgiyi içeren, Türkçe bir madde listesi
  agent: researcher

reporting_task:
  description: >
    Araştırma sonuçlarını kullanarak şu işi tamamla: {gorev}
    Sonuç, ajans sahibinin onayına sunulacak. Eksiksiz ve doğrudan kullanılabilir olsun.
  expected_output: >
    İşin tamamlanmış hali, Türkçe ve markdown biçiminde ('```' kullanmadan)
  agent: reporting_analyst
